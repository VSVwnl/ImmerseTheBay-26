<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="t d">
  <title id="t">Backlot</title>
  <desc id="d">An orange robot arm in front of a curved wall glowing with a generated world.</desc>
  <defs>
    <linearGradient id="world" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd3c0"/>
      <stop offset="0.5" stop-color="#7a6bff"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c28"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <clipPath id="tile"><rect x="18" y="18" width="144" height="144" rx="34"/></clipPath>
  </defs>

  <!-- banner background (dark, so it reads in light and dark themes) -->
  <rect width="720" height="180" rx="36" fill="url(#bg)"/>

  <!-- mark -->
  <g clip-path="url(#tile)">
    <rect x="18" y="18" width="144" height="144" fill="#0f1620"/>
    <!-- the curved wall: a generated world behind the arm -->
    <path d="M28 128 Q90 18 152 128 L140 128 Q90 42 40 128 Z" fill="url(#world)"/>
    <path d="M44 128 Q90 52 136 128 Z" fill="url(#world)" opacity="0.18"/>
    <!-- table -->
    <rect x="30" y="128" width="120" height="8" rx="4" fill="#c9d3df"/>
    <!-- arm -->
    <rect x="66" y="114" width="26" height="14" rx="4" fill="#2a3442"/>
    <line x1="79" y1="114" x2="100" y2="74" stroke="#f28a1e" stroke-width="12" stroke-linecap="round"/>
    <line x1="100" y1="74" x2="124" y2="96" stroke="#f28a1e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="79" cy="114" r="6" fill="#0f1620" stroke="#f28a1e" stroke-width="3"/>
    <circle cx="100" cy="74" r="6" fill="#0f1620" stroke="#f28a1e" stroke-width="3"/>
    <!-- gripper -->
    <path d="M124 96 v5 M117 101 h14 M117 101 v8 M131 101 v8" stroke="#e8edf3" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <rect x="117" y="114" width="14" height="14" rx="2" fill="#4cc2ff"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-1.5" fill="#f4f7fb">Backlot</text>
  <text x="199" y="146" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#9fb3c8">Teach a robot once. Test it in a hundred worlds.</text>
  <rect x="199" y="114" width="64" height="4" rx="2" fill="url(#world)"/>
</svg>
