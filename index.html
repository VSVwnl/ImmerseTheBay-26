<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backlot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23f28a1e%22/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0d10; color: #eef2f6; font: 14px system-ui, sans-serif; overflow: hidden; }
      canvas#scene { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #hud .panel { pointer-events: auto; position: absolute; background: rgba(14,16,22,0.82); border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px; padding: 10px 12px; box-sizing: border-box; backdrop-filter: blur(4px); }
      #hud .panel-world { left: 12px; top: 12px; width: 220px; }
      #hud .panel-status { left: 50%; transform: translateX(-50%); top: 12px; min-width: 280px; text-align: center; }
      #hud .panel-side { right: 12px; top: 12px; width: 330px; }
      #hud .panel-counter { left: 50%; transform: translateX(-50%); top: 108px; width: 330px; text-align: center; } /* under the status panel: clear of the side panel buttons and of the table */
      #hud .panel-thumbs { right: 12px; bottom: 60px; width: 330px; }
      #hud .panel-table { left: 12px; bottom: 56px; }
      #hud .thumb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
      #hud .thumb-grid figure { margin: 0; }
      #hud .thumb-grid canvas { width: 100%; image-rendering: auto; border-radius: 4px; display: block; }
      #hud .thumb-grid figcaption { font-size: 10px; color: #c9d3dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #hud .panel-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9fb3c8; margin-bottom: 6px; font-weight: 700; }
      #hud .panel-line { line-height: 1.35; white-space: pre; }
      #hud .panel-line.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      #hud .panel-line.bold { font-weight: 700; }
      #hud .panel-buttons { display: grid; gap: 6px; margin-top: 8px; }
      #hud button { background: #2b3a52; color: #fff; border: 0; border-radius: 6px; padding: 7px 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
      #hud button:hover { background: #3a4d6b; }
      #hud button.active { background: #f28a1e; }
      #hud button:disabled { background: #444; color: #888; cursor: default; }
      #hud .factory-panel { left: 12px; top: 12px; width: 420px; }
      #hud .factory-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 6px; }
      #hud #f-preview { width: 192px; height: 192px; image-rendering: pixelated; border-radius: 4px; background: #000; }
      #hud .f-log { max-height: 140px; overflow: auto; color: #9fb3c8; margin-top: 8px; white-space: pre-wrap; }
      #toolbar { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; pointer-events: auto; }
      #toolbar button { background: #20242c; color: #cfd6de; border: 1px solid #3a404c; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      #help { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); color: #8c96a3; font-size: 12px; pointer-events: none; text-align: center; }
      body.xr #hud, body.xr #toolbar, body.xr #help { display: none; }
      #VRButton { left: auto !important; right: 12px !important; bottom: 12px !important; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="toolbar"></div>
    <div id="help">Mouse: move arm &middot; wheel or W/S: up/down &middot; click or Space: grip &middot; 1&ndash;6: world</div>
    <template id="recovery-template">
      <main class="rc-console" aria-label="Parcel recovery operator console">
        <header class="rc-nav">
          <div class="rc-brand"><span class="rc-mark" aria-hidden="true"><i></i><b></b></span>Backlot</div>
          <span class="rc-nav-divider" aria-hidden="true"></span>
          <span class="rc-nav-label rc-operator-label">Operator console</span><span class="rc-nav-label rc-audience-label">Spectator view</span>
          <div class="rc-nav-actions">
            <a class="rc-spectator-link" href="?mode=spectator" target="_blank" rel="noopener">Spectator view <span aria-hidden="true">↗</span></a>
            <button type="button" class="rc-quest" data-action="enter-xr"><span class="rc-visors" aria-hidden="true"></span>Enter VR</button>
          </div>
        </header>
        <div class="rc-page">
          <div class="rc-mast">
            <div><h1>Parcel recovery<span aria-hidden="true">.</span></h1><p class="rc-operator-label">Generate a blockage, teach a route and replay the recovery.</p><p class="rc-audience-label">Follow the operator’s incident and compare each robot run.</p></div>
            <div class="rc-session-controls">
              <button type="button" class="rc-text-button" data-action="practice">Local rehearsal</button>
              <button type="button" class="rc-neutral" data-action="reset"><span aria-hidden="true">↺</span> Reset</button>
            </div>
          </div>
          <div class="rc-layout">
            <section class="rc-workcell" aria-labelledby="rc-cell-title">
              <div class="rc-panel-head rc-dark-head">
                <h2 id="rc-cell-title"><span class="rc-glyph-cell" aria-hidden="true"></span>Robot workcell</h2>
                <span class="rc-micro rc-source"><i></i> Simulation</span>
              </div>
              <div class="rc-stage" data-el="stage" aria-label="Interactive robot workcell"></div>
              <div class="rc-run">
                <div class="rc-run-copy">
                  <div class="rc-phase"><span data-el="phase-dot"></span><span data-el="phase">Standby</span></div>
                  <h3 data-el="title" aria-live="polite">Set up an incident</h3>
                  <p data-el="caption">Steer the infeed or start a local rehearsal.</p>
                </div>
                <div class="rc-run-actions" data-el="run-actions">
                  <button type="button" class="rc-action" data-action="baseline" hidden>Run baseline <span aria-hidden="true">→</span></button>
                  <button type="button" class="rc-action" data-action="teach" hidden>Teach recovery <span aria-hidden="true">→</span></button>
                  <button type="button" class="rc-action" data-action="save" hidden>Save demonstration <span aria-hidden="true">✓</span></button>
                  <button type="button" class="rc-action" data-action="replay" hidden>Replay skill <span aria-hidden="true">▷</span></button>
                  <button type="button" class="rc-action rc-secondary-action" data-action="next" hidden>Next incident <span aria-hidden="true">→</span></button>
                </div>
              </div>
              <div class="rc-input-guide"><span class="rc-hint-symbol" aria-hidden="true">⌖</span><span data-el="input">Mouse moves the arm · Wheel or W/S changes height · Click or Space grips</span></div>
            </section>
            <aside class="rc-director" aria-labelledby="rc-director-title">
              <div class="rc-panel-head"><h2 id="rc-director-title">Incident generator</h2><span class="rc-mode" data-el="mode">Local</span></div>
              <div class="rc-preview"><canvas data-el="feed" width="384" height="216" role="img" aria-label="Infeed camera preview"></canvas>
                <div class="rc-feed-stamp"><span class="rc-aperture" aria-hidden="true"></span><span data-el="feed-stamp">Workcell plan</span></div>
                <div class="rc-crosshairs" aria-hidden="true"></div>
              </div>
              <div class="rc-director-body">
                <div class="rc-infeed-label"><span data-el="source">Local infeed</span><span class="rc-micro" data-el="lane">Awaiting incident</span></div>
                <p data-el="feed-caption">Steer the live infeed, then capture a clear frame.</p>
                <div class="rc-steer" role="group" aria-label="Steer the world">
                  <button type="button" class="rc-neutral" data-action="steer-left"><span aria-hidden="true">←</span> Steer left</button>
                  <button type="button" class="rc-neutral" data-action="steer-right">Steer right <span aria-hidden="true">→</span></button>
                </div>
                <button type="button" class="rc-capture" data-action="capture"><span class="rc-shutter" aria-hidden="true"></span>Capture frame</button>
                <div class="rc-confirm" role="group" aria-label="Confirm obstruction in captured frame" data-el="confirm" hidden>
                  <span class="rc-micro">Confirm the blocked side</span>
                  <div><button type="button" class="rc-neutral" data-action="confirm-left">Left side</button><button type="button" class="rc-neutral" data-action="confirm-right">Right side</button></div>
                  <small>Frame unclear? Steer again to generate another.</small>
                </div>
                <button type="button" class="rc-neutral rc-retry" data-action="retry" hidden>Reconnect to Orbis</button>
              </div>
            </aside>
          </div>
          <section class="rc-results" aria-labelledby="rc-results-title">
            <div class="rc-results-head"><div class="rc-results-heading"><h2 id="rc-results-title">Run comparison</h2><span class="rc-micro" data-el="run-count" hidden></span></div>
              <div class="rc-data-actions"><button type="button" class="rc-text-button" data-action="resume" hidden>Load saved skill</button><button type="button" class="rc-neutral" data-action="download"><span aria-hidden="true">↓</span> Export episode</button></div>
            </div>
            <div class="rc-table-wrap"><table>
              <thead><tr><th scope="col">Run</th><th scope="col">Completion</th><th scope="col">Path length</th><th scope="col">Collisions</th><th scope="col">Duration</th></tr></thead>
              <tbody>
                <tr data-result="clear" hidden><th scope="row"><span class="rc-trace nominal"></span>Clear station</th><td>—</td><td>—</td><td>—</td><td>—</td></tr>
                <tr data-result="baseline"><th scope="row"><span class="rc-trace baseline"></span>Baseline</th><td>—</td><td>—</td><td>—</td><td>—</td></tr>
                <tr data-result="demonstration" hidden><th scope="row"><span class="rc-trace human"></span>Human correction</th><td>—</td><td>—</td><td>—</td><td>—</td></tr>
                <tr data-result="recovery"><th scope="row"><span class="rc-trace recovered"></span>Skill replay</th><td>—</td><td>—</td><td>—</td><td>—</td></tr>
                <tr data-result="fresh" hidden><th scope="row"><span class="rc-trace fresh"></span>Fresh incident</th><td>—</td><td>—</td><td>—</td><td>—</td></tr>
              </tbody>
            </table></div>
            <div class="rc-skill" data-el="skill" hidden>
              <div class="rc-timeline-main">
                <div class="rc-timeline-title"><h3>Saved skill</h3><span class="rc-micro" data-el="timeline-count"></span></div>
                <div class="rc-timeline" data-el="timeline" role="img" aria-label="Recorded demonstration phases">
                  <div class="rc-bands" data-el="bands"></div><span class="rc-playhead" data-el="playhead" hidden></span>
                </div>
                <ol class="rc-phase-list" data-el="phase-list" aria-label="Demonstration phases"></ol>
              </div>
              <figure class="rc-evidence" data-el="evidence" hidden><img data-el="evidence-image" alt="Captured Orbis frame for the saved demonstration"><figcaption data-el="evidence-label">Captured incident</figcaption></figure>
            </div>
            <div class="rc-record" data-el="record" hidden><span data-el="incident"></span><span data-el="samples"></span></div>
          </section>
        </div>
      </main>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
